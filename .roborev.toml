# roborev（コミットごとの自動レビュー）の設定

# work/ と eval/ の TSV は本の文字を含むデータで、コードではない。
# レビューの対象にもしないし、レビュー用エージェントにも送らない。
exclude_patterns = ["work/**", "eval/**", "*.html"]

review_guidelines = """
bookscan-epub は、自炊した本の画像PDFに透明テキスト層を重ねる個人用の実験リポジトリ。
sh と Python（bin/ 以下）で、NDLOCR-Lite、YomiToku、ローカルLLMを順に呼ぶ。
使うのは本人だけで、ローカルでしか動かさない。

指摘してほしいこと:
- 処理の誤り。テキスト層の文字、行、ページのずれ、補正の適用順序、TSV の列の取り違え、
  Unicode（全角／半角、濁点・半濁点、合成文字）の扱いの誤り
- 再実行時の不具合。content hash でのスキップ判定、途中で落ちたときに壊れた成果物が残ること、
  完成した PDF を意図せず上書きすること
- sh の落とし穴。クォート漏れ、set -e の効かない箇所、空白を含むパス
- 著作権のある本文を git の管理対象へ漏らす変更。.gitignore の除外を崩すもの

指摘しないこと:
- 認証、入力の検証、レート制限など、公開サービス向けの懸念
- 型ヒント、docstring、命名、行の長さなどのスタイル
- 試験用スクリプト（bin/study/、bin/annotate/）の作りの粗さ
- 一度きりの実験コードへの抽象化やテストの追加の提案

指摘は日本語で書く。
"""
